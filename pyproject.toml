[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"

[tool.ruff.lint]
# Live operations deliberately convert unexpected ADB/vision failures into
# structured safety stops at their process boundaries.
ignore = ["BLE001", "RUF100"]
