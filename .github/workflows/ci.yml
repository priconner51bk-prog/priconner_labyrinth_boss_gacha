name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install GUI test runtime
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Install dependencies
        run: python -m pip install -r requirements.txt ruff
      - name: Compile Python sources
        run: python -m compileall -q scripts src
      - name: Run tests
        run: xvfb-run -a python -m pytest -q
      - name: Run static checks
        run: python -m ruff check scripts src --select F,E9,F63,F7,F82,PLW1510
      - name: Validate screen catalog
        run: python scripts/validate_screen_catalog.py
      - name: Run safety audit
        run: python scripts/audit_safety.py
